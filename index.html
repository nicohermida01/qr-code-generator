<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Quick QR</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>

		<link rel="stylesheet" href="styles.css" />

		<script
			defer
			src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
		></script>
		<script defer src="app.js"></script>
	</head>
	<body>
		<main class="screen">
			<header class="topbar">
				<div class="wordmark">quick<span class="sep">&mdash;</span>qr</div>
				<div class="status" id="status" data-state="idle">
					<span class="status-dot"></span>
					<span class="status-text">ready &middot; idle</span>
				</div>
			</header>

			<div class="workbench">
				<section class="pane pane-input">
					<h1 class="label">Input</h1>
					<p class="tagline">
						Turn a link or any text into a scannable code, then export it
						as PNG or SVG.
					</p>

					<form class="qr-form" id="qrForm">
						<div class="code-field">
							<span class="prompt" aria-hidden="true">&gt;</span>
							<input
								type="text"
								id="qr-link"
								name="qr-link"
								placeholder="https://example.com"
								autocomplete="off"
								autocapitalize="off"
								spellcheck="false"
								required
							/>
						</div>
						<button class="btn-generate" type="submit">Generate</button>
					</form>
				</section>

				<section class="pane pane-output">
					<h2 class="label">Output</h2>
					<div class="plate" id="plate" data-empty="true">
						<div class="qr-holder" id="containerQR"></div>
						<span class="bracket tl"></span>
						<span class="bracket tr"></span>
						<span class="bracket bl"></span>
						<span class="bracket br"></span>
						<p class="plate-hint">no code yet</p>
					</div>
				</section>
			</div>

			<footer class="actionbar">
				<button class="action" id="pngBtn" type="button" disabled>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path d="M12 3v12" />
						<path d="m7 10 5 5 5-5" />
						<path d="M5 21h14" />
					</svg>
					<span>PNG</span>
				</button>
				<button class="action" id="svgBtn" type="button" disabled>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path d="M12 3v12" />
						<path d="m7 10 5 5 5-5" />
						<path d="M5 21h14" />
					</svg>
					<span>SVG</span>
				</button>
				<button class="action" id="copyBtn" type="button" disabled>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<rect x="9" y="9" width="12" height="12" rx="2" />
						<path d="M5 15V5a2 2 0 0 1 2-2h10" />
					</svg>
					<span>Copy</span>
				</button>
				<span class="readout" id="readout">&mdash; &times; &mdash; &middot; EC M</span>
			</footer>
		</main>

		<footer class="site-footer">
			<span>&copy; 2026 Quick QR</span>
			<span class="dot-sep" aria-hidden="true">&middot;</span>
			<a
				class="credito"
				href="https://estudionodo.tech"
				target="_blank"
				rel="noopener"
			>
				Sitio desarrollado por <span class="credito__brand">Estudio Nodo</span>
			</a>
		</footer>
	</body>
</html>
